version: '3.9'

services:

  postgres:

    image: postgres:17

    container_name: seatsure-postgres

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Dhaneesh@123

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:

    build: .

    container_name: seatsure-backend

    ports:
      - "8080:8080"

    depends_on:
      - postgres

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/postgres
      DB_USERNAME: postgres
      DB_PASSWORD: Dhaneesh@123

  frontend:

    build:
      context: ./seatsure-ui

    container_name: seatsure-frontend

    ports:
      - "4200:80"

    depends_on:
      - backend

volumes:

  postgres-data: