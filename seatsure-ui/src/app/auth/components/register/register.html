<div class="container">

  <div class="card">

    <h1 class="page-title">

      Create Account

    </h1>

    <form
      [formGroup]="registerForm"
      (ngSubmit)="register()">

      <div>

        <label>Name</label>

        <input
          type="text"
          formControlName="name">

      </div>

      <div>

        <label>Email</label>

        <input
          type="email"
          formControlName="email">

      </div>

      <div>

        <label>Password</label>

        <input
          type="password"
          formControlName="password">

      </div>

      <br>

      <button
        class="btn btn-primary"
        type="submit">

        Register

      </button>

    </form>

    <br>

    <p>

      Already have an account?

      <a routerLink="/login">

        Login

      </a>

    </p>

  </div>

</div>
