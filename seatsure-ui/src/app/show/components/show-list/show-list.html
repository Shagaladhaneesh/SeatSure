<div class="container">

  <h1 class="page-title">

    🎭 Available Shows

  </h1>

  <div
    class="show-card card"
    *ngFor="let show of shows">

    <h2>{{ show.movieName }}</h2>

    <div class="show-details">

      <p><strong>🏢 Theatre:</strong> {{ show.theatreName }}</p>

      <p><strong>🎬 Screen:</strong> {{ show.screenNumber }}</p>

      <p><strong>🕒 Starts:</strong> {{ show.startTime }}</p>

      <p><strong>⏰ Ends:</strong> {{ show.endTime }}</p>

    </div>

    <button
      class="btn btn-primary"
      [routerLink]="['/shows', show.id, 'seats']">

      Select Seats

    </button>

  </div>

</div>
